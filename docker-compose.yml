version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: decisionroom_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - decisionroom_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decisionroom_backend
    restart: unless-stopped
    command: sh -c "mkdir -p tmp/pids tmp/cache log && rm -f tmp/pids/server.pid && bundle exec puma -C config/puma.rb"
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - PORT=3000
      - ALLOWED_ORIGINS=*
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    networks:
      - decisionroom_network

volumes:
  redis_data:
  bundle_cache:

networks:
  decisionroom_network:
    driver: bridge
